name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit + API tests (offline)
        run: pytest -q
      - name: Retrieval eval with real embeddings + reranker (fails if hit@6 < 0.90)
        run: python -m eval.run_eval --min-hit 0.90
      - name: Publish eval report to the job summary
        if: always()
        run: if [ -f eval/report.md ]; then cat eval/report.md >> "$GITHUB_STEP_SUMMARY"; fi
